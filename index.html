<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./font-awesome-4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="./calendar.css">
    <title>Calendar</title>
</head>
<body>
    <div class="calendar">
        <div class="header">
            <div class="btn" id="btn_left"><i class="fa fa-arrow-left" aria-hidden="true"></i></div>
             <div class="month-year" id="month-year"></div>
             <div class="btn" id="btn_right"><i class="fa fa-arrow-right" aria-hidden="true"></i></div>
        </div>
        <div class="weekdays" id="weekdays">
            <div>Sun</div>
            <div>Mon</div>
            <div>Tue</div>
            <div>Wed</div>
            <div>Thu</div>
            <div>Fri</div>
            <div>Sat</div>
        </div>
        <div class="days" id="days"></div>
    </div>
    <script src="./calendar.js"></script>
</body>
</html>
